name: client-exports
# Builds Windows, macOS and Android (debug) clients. The export templates are
# 1.3 GB, so this runs only on main and on demand, not on every pull request.
# iOS needs an Apple developer team ID and is not exported here.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Download pinned Godot editor and export templates
        shell: bash
        run: |
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          # SHA-512 from the release's SHA512-SUMS.txt
          echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  /tmp/templates.tpz" | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT"
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Configure Android SDK and debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export
        shell: bash
        run: |
          mkdir -p build/windows build/macos build/android
          "$GODOT" --headless --editor --path client --import --quit
          "$GODOT" --headless --path client --export-release "Windows" ../build/windows/jianghu.exe
          "$GODOT" --headless --path client --export-release "macOS" ../build/macos/jianghu.zip
          "$GODOT" --headless --path client --export-debug "Android" ../build/android/jianghu.apk
          ls -la build/*
          test -s build/windows/jianghu.exe && test -s build/macos/jianghu.zip && test -s build/android/jianghu.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianghu-clients
          path: build/
          retention-days: 14
