name: bootstrap-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server-and-design:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      JIANGHU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      JIANGHU_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Go and design model checks
        run: ./scripts/check.sh
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot standard build
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and run client checks
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path client --import --quit
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/test_bootstrap.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --quit-after 3
