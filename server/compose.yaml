# Local development database only. Bound to 127.0.0.1; the password is a
# development placeholder, never reuse it anywhere reachable. Host port 5433
# so it does not clash with a locally installed PostgreSQL on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jianghu
      POSTGRES_PASSWORD: jianghu-dev
      POSTGRES_DB: jianghu
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jianghu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianghu -d jianghu"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  jianghu-pg:
